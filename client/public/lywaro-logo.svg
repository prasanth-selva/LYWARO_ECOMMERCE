<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100" width="1100" height="1100">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="0.45" stop-color="#cfcfcf"/>
      <stop offset="0.72" stop-color="#8d8d8d"/>
      <stop offset="1" stop-color="#e9e9e9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".75"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1100" fill="#0b0b0b"/>

  <!-- LY monogram -->
  <g filter="url(#shadow)" fill="url(#metal)" stroke="#f2f2f2" stroke-width="2">
    <!-- left vertical -->
    <path d="M394 108 L438 152 L438 488 L394 532 Z"/>
    <!-- lower-left diagonal -->
    <path d="M394 532 L394 608 L528 478 L455 478 Z"/>
    <!-- central upper diagonal -->
    <path d="M510 432 L559 383 L695 519 L695 596 L510 411 Z"/>
    <!-- right vertical -->
    <path d="M651 268 L695 225 L695 446 L651 403 Z"/>
    <!-- lower-right diagonal accent -->
    <path d="M695 519 L695 596 L604 505 L650 459 Z"/>
  </g>

  <!-- subtle edge highlights -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1">
    <path d="M394 108 L438 152 L438 488"/>
    <path d="M651 268 L695 225 L695 446"/>
  </g>

  <!-- Brand name -->
  <text x="550" y="785"
        text-anchor="middle"
        fill="#f4f4f4"
        font-family="Montserrat, Helvetica Neue, Arial, sans-serif"
        font-size="108"
        font-weight="300"
        letter-spacing="24">LYWARO</text>

  <!-- Tagline -->
  <text x="550" y="888"
        text-anchor="middle"
        fill="#e5e5e5"
        font-family="Montserrat, Helvetica Neue, Arial, sans-serif"
        font-size="30"
        font-weight="300"
        letter-spacing="10">CRAFTING DIGITAL EXPERIENCES.</text>
</svg>